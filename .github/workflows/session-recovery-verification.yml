name: Session recovery verification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/auth/**'
      - 'src/services/browserRecoveryState.ts'
      - 'src/services/appCacheStorage.ts'
      - 'src/services/appCacheStorage.test.ts'
      - 'src/services/profileSectionStorage.ts'
      - 'src/services/apiClient.ts'
      - 'src/store/useAppStore.ts'
      - 'src/pages/Login/**'
      - 'src/features/welcome/**'
      - 'src/pages/Family/EditFamilyMemberPage.tsx'
      - 'tests/session-recovery/**'
      - 'tests/welcome/**'
      - '.github/workflows/session-recovery-verification.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:client
      - run: npm run test:auth
      - run: node --test server/auth/password-http-types.test.mjs server/auth/password-token-revocation.test.mjs
      - run: npm run build
      - run: npx playwright test --config tests/session-recovery/playwright.config.ts --reporter=line
      - run: npx playwright test --config tests/welcome/playwright.config.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-recovery-browser-evidence
          retention-days: 7
          path: test-results/
