name: Allergy knowledge verification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['src/features/allergy-knowledge/**', 'src/pages/AllergyKnowledge/**', 'src/pages/NurseStation/HomeFlows*', 'tests/dialogue/knowledge*', '.github/workflows/allergy-knowledge-verification.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bound system dependency download waits
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hoooho-ci-timeouts >/dev/null <<'APT'
          Acquire::Retries "1";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT
      - run: npx playwright install chromium
      - name: Verify browser system dependencies
        run: |
          hoho_browser_smoke='const { chromium } = require("@playwright/test"); chromium.launch().then(browser => browser.close()).catch(error => { console.error(error); process.exitCode = 1; });'
          if ! node -e "$hoho_browser_smoke"; then
            npx playwright install-deps chromium
            node -e "$hoho_browser_smoke"
          fi
      - run: node --import ./scripts/register-node-ts-loader.mjs --test src/features/allergy-knowledge/daily.test.ts src/pages/NurseStation/nurseStationStyle.contract.test.ts src/pages/NurseStation/nurseStationView.test.ts
      - run: npm run build
      - run: npx playwright test --config tests/dialogue/knowledge.config.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allergy-knowledge-mobile-evidence
          retention-days: 7
          path: test-results/
