name: Bowel form verification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/HealthEvents/Bowel*'
      - 'tests/bowel-form/**'
      - '.github/workflows/bowel-form-verification.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bound system dependency download waits
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hoooho-ci-timeouts >/dev/null <<'APT'
          Acquire::Retries "1";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT
      - name: Use bundled media tools
        run: |
          node --input-type=module <<'NODE'
          import ffmpeg from '@ffmpeg-installer/ffmpeg'
          import ffprobe from 'ffprobe-static'
          import { dirname } from 'node:path'
          import { appendFileSync } from 'node:fs'
          appendFileSync(process.env.GITHUB_PATH, [dirname(ffmpeg.path), dirname(ffprobe.path), ''].join('\n'))
          NODE
      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - run: npx playwright install chromium
      - name: Verify browser system dependencies
        run: |
          hoho_browser_smoke='const { chromium } = require("@playwright/test"); chromium.launch().then(browser => browser.close()).catch(error => { console.error(error); process.exitCode = 1; });'
          if ! node -e "$hoho_browser_smoke"; then
            npx playwright install-deps chromium
            node -e "$hoho_browser_smoke"
          fi
      - run: npm run test:client
      - run: npm run test:server
      - run: npm run build
      - run: npx playwright test --config tests/bowel-form/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bowel-form-evidence
          retention-days: 7
          path: |
            outputs/bowel-form
            test-results/bowel-form
