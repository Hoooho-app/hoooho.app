name: Smart record verification
on:
  push:
    branches: [codex/smart-record-progress-20261016]
  pull_request:
    paths: ['server/ai/**', 'src/features/ai-business/**', 'tests/dialogue/**', 'tests/conversation-home/**', '.github/workflows/smart-record-verification.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bound system dependency download waits
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hoooho-ci-timeouts >/dev/null <<'APT'
          Acquire::Retries "1";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT
      - name: Use bundled media tools
        run: |
          node --input-type=module <<'NODE'
          import ffmpeg from '@ffmpeg-installer/ffmpeg'
          import ffprobe from 'ffprobe-static'
          import { dirname } from 'node:path'
          import { appendFileSync } from 'node:fs'
          appendFileSync(process.env.GITHUB_PATH, [dirname(ffmpeg.path), dirname(ffprobe.path), ''].join('\n'))
          NODE
      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - run: npx playwright install chromium
      - name: Verify browser system dependencies
        run: |
          hoho_browser_smoke='const { chromium } = require("@playwright/test"); chromium.launch().then(browser => browser.close()).catch(error => { console.error(error); process.exitCode = 1; });'
          if ! node -e "$hoho_browser_smoke"; then
            npx playwright install-deps chromium
            node -e "$hoho_browser_smoke"
          fi
      - run: node --test server/ai/recognition-jobs.test.mjs server/ai/front-desk-record.test.mjs server/ai/business/*.test.mjs
      - run: node --import ./scripts/register-node-ts-loader.mjs --test src/features/case-continuity/followupPresentation.test.ts
      - run: npm run test:help
      - run: npm run build
      - run: npx playwright test --config tests/dialogue/symptom-followup.config.ts
      - if: ${{ !cancelled() }}
        run: npx playwright test --config tests/dialogue/playwright.config.ts recognition-progress.spec.ts smart-record-actions.spec.ts smart-record-exit.spec.ts --grep-invert 'saving while ASR is pending'
      - run: npx playwright test --config tests/conversation-home/playwright.config.ts
      - run: npx playwright test --config tests/conversation-home/pure-record.config.ts
      - run: npx playwright test --config tests/conversation-home/forest.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-record-browser-evidence
          path: |
            outputs/symptom-followup/
            test-results/
            playwright-report/
