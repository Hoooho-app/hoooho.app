name: Smart record verification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['server/ai/**', 'src/features/ai-business/**', 'tests/dialogue/**', 'tests/helpers/**', 'tests/visit-sheet/**', 'tests/nurse-frontdesk-upgrade-mobile/**', 'tests/front-desk-continuous/**', 'tests/selective-rollback/**', 'tests/conversation-home/**', '.github/workflows/smart-record-verification.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bound system dependency download waits
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hoooho-ci-timeouts >/dev/null <<'APT'
          Acquire::Retries "1";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT
      - name: Use bundled media tools
        run: |
          node --input-type=module <<'NODE'
          import ffmpeg from '@ffmpeg-installer/ffmpeg'
          import ffprobe from 'ffprobe-static'
          import { dirname } from 'node:path'
          import { appendFileSync } from 'node:fs'
          appendFileSync(process.env.GITHUB_PATH, [dirname(ffmpeg.path), dirname(ffprobe.path), ''].join('\n'))
          NODE
      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - run: npx playwright install chromium
      - name: Verify browser system dependencies
        run: |
          hoho_browser_smoke='const { chromium } = require("@playwright/test"); chromium.launch().then(browser => browser.close()).catch(error => { console.error(error); process.exitCode = 1; });'
          if ! node -e "$hoho_browser_smoke"; then
            npx playwright install-deps chromium
            node -e "$hoho_browser_smoke"
          fi
      - run: node --test server/events/health-event-record-service.test.mjs server/events/case-continuity-service.test.mjs server/ai/recognition-jobs.test.mjs server/ai/front-desk-record.test.mjs server/ai/front-desk-resume.test.mjs server/ai/front-desk-original-save.test.mjs server/ai/recognition-context.test.mjs server/ai/live-audio-preview.test.mjs server/ai/business/*.test.mjs
      - run: node --import ./scripts/register-node-ts-loader.mjs --test src/features/case-continuity/followupPresentation.test.ts src/features/ai-business/liveAudioPreview.test.ts src/features/ai-business/frontDeskRecord.test.ts src/features/ai-business/captureDraft.test.ts src/features/ai-business/savedRecordGuide.test.ts
      - run: TZ=Asia/Shanghai node --import ./scripts/register-node-ts-loader.mjs --test src/pages/NurseStation/firstChildSetupModel.test.ts
      - run: node --test tests/dialogue/synthetic-acceptance-account.test.mjs tests/dialogue/synthetic-acceptance-cleanup.test.mjs
      - run: node --test tests/visit-sheet/front-desk-v3-fixture.test.mjs
      - run: npm run test:help
      - run: node --test tests/selective-rollback/baseline-contract.test.mjs server/ai/front-desk-continuous.test.mjs server/ai/front-desk-understanding.test.mjs server/ai/front-desk-record-targets.test.mjs
      - run: npm run build
      - run: npx playwright test --config tests/dialogue/symptom-followup.config.ts
      - if: ${{ !cancelled() }}
        run: npx playwright test --config tests/dialogue/playwright.config.ts recognition-progress.spec.ts smart-record-actions.spec.ts smart-record-exit.spec.ts nursing-record.spec.ts nurse-dialogue-guidance.spec.ts --grep-invert 'saving while ASR is pending'
      - name: Verify current protocol3 front-desk mobile flows
        if: ${{ !cancelled() }}
        run: npx playwright test --config tests/front-desk-continuous/playwright.config.ts
      - name: Verify selective rollback draft and data compatibility
        run: npx playwright test --config tests/selective-rollback/playwright.config.ts
      - run: npx playwright test --config tests/conversation-home/playwright.config.ts
      - run: npx playwright test --config tests/conversation-home/first-child.config.ts
      - run: npx playwright test --config tests/conversation-home/pure-record.config.ts
      - run: npx playwright test --config tests/conversation-home/forest.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-record-browser-evidence
          retention-days: 7
          path: |
            outputs/symptom-followup/
            test-results/
            playwright-report/
