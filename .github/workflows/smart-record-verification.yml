name: Smart record verification
on:
  push:
    branches: [codex/smart-record-progress-20261016]
  pull_request:
    paths: ['server/ai/**', 'src/features/ai-business/**', 'tests/dialogue/**', 'tests/conversation-home/**', '.github/workflows/smart-record-verification.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: node --test server/ai/recognition-jobs.test.mjs server/ai/front-desk-record.test.mjs server/ai/business/*.test.mjs
      - run: node --import ./scripts/register-node-ts-loader.mjs --test src/features/case-continuity/followupPresentation.test.ts
      - run: npm run build
      - run: npx playwright test --config tests/dialogue/symptom-followup.config.ts
      - if: ${{ !cancelled() }}
        run: npx playwright test --config tests/dialogue/playwright.config.ts recognition-progress.spec.ts smart-record-actions.spec.ts smart-record-exit.spec.ts --grep-invert 'saving while ASR is pending'
      - run: npx playwright test --config tests/conversation-home/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-record-browser-evidence
          path: |
            outputs/symptom-followup/
            test-results/
            playwright-report/
