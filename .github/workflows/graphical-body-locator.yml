name: Graphical body locator verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/health/body-location/**'
      - 'src/features/body-location/**'
      - 'src/pages/HealthEvents/symptomRecordLogic*'
      - 'tests/body-locator/**'
      - '.github/workflows/graphical-body-locator.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: TZ=Asia/Shanghai npm run test:client
      - run: npx playwright test --config tests/body-locator/graphical.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphical-body-locator-evidence
          retention-days: 7
          path: |
            outputs/graphical-locator/
            test-results/graphical-body-locator/
