name: Quick search isolated online acceptance
on:
  push:
    branches: [codex/quick-search-online-20261017]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify isolated Staging
        run: node tests/home-flows/quick-search-release.mjs https://hoooho-calendar-verify-20261010-staging.up.railway.app
      - name: Verify Production after Staging
        run: node tests/home-flows/quick-search-release.mjs https://hoooho.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-search-isolated-online-evidence
          path: outputs/quick-search/
