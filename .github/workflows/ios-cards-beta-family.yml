name: Verify family management in the internal beta
on:
  push:
    branches: ['codex/cards-beta-family-7d6ea1cd']
    paths: ['.github/cards-beta-family/ready']
permissions:
  contents: read
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install Apple API token tooling
        run: gem install jwt --version 2.10.2 --no-document
      - name: Verify the exact build in the existing internal test group
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          ruby -c .github/cards-beta-family/assign.rb
          ruby .github/cards-beta-family/assign.rb
