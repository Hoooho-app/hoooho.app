name: Verify the pinned camera guidance on iPhone simulator
on:
  push:
    branches: ['codex/ios-sign-once-camera-15d45c03']
    paths: ['.github/workflows/ios-internal-sign-once.yml']
permissions:
  contents: read
concurrency:
  group: cards-camera-qa-15d45c03
  cancel-in-progress: false
jobs:
  camera_qa:
    runs-on: macos-15
    timeout-minutes: 28
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare a run-specific encrypted intake
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/ios-internal-sign"
          mkdir -m 700 "$private_dir"
          python3 -m venv "$private_dir/venv"
          "$private_dir/venv/bin/pip" install --quiet 'cryptography==50.0.0'
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$private_dir/private.pem" 2>/dev/null
          openssl pkey -in "$private_dir/private.pem" -pubout > "$private_dir/Public.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-one-shot-public-key
          path: ${{ runner.temp }}/ios-internal-sign/Public.pem
          retention-days: 1
          if-no-files-found: error
      - name: Fetch and validate the sealed release input
        env:
          EXPECTED_ARCHIVE_SHA: '1888f4704ab65fb10cbf4031b33659135f1a1a46c297d608c16fd781297b01fd'
          EXPECTED_SOURCE: '15d45c03651fd1c3ba6b3d13ae144639d50fd3fd'
          SEALED_INPUT_BRANCH: 'codex/cards-camera-sealed-15d45c03'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/ios-internal-sign"
          py="$private_dir/venv/bin/python"
          # Accept only the sealed source digest pinned to this validation and beta run.
          ref="repos/$GITHUB_REPOSITORY/git/ref/heads/$SEALED_INPUT_BRANCH"
          input_commit=""
          for check in $(seq 1 120); do
            if input_commit="$(gh api "$ref" --jq '.object.sha' 2>/dev/null)"; then break; fi
            sleep 5
          done
          if ! [[ "$input_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The authorized sealed input did not arrive.'; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$input_commit?recursive=1" \
            --jq '.tree[] | select(.type == "blob" and (.path | test("^\\.github/cards-camera-intake/part-[0-9]{3}$"))) | [.path, .sha] | @tsv' \
            | LC_ALL=C sort > "$private_dir/parts.tsv"
          test -s "$private_dir/parts.tsv"
          : > "$private_dir/Package.sealed"
          while IFS=$'\t' read -r path blob; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' \
              | python3 -c 'import base64, sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' >> "$private_dir/Package.sealed"
          done < "$private_dir/parts.tsv"
          "$py" .github/ios-sign-once/transport.py open "$private_dir/private.pem" "$private_dir/Package.sealed" "$EXPECTED_ARCHIVE_SHA" "$private_dir/source.tgz"
          rm -f "$private_dir/private.pem" "$private_dir/Package.sealed"
          mkdir -m 700 "$private_dir/source"
          "$py" .github/ios-sign-once/transport.py extract "$private_dir/source.tgz" "$private_dir/source"
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["verified_source"] == sys.argv[2]' "$private_dir/source/release.json" "$EXPECTED_SOURCE"
          rm -f "$private_dir/source.tgz"
          echo "Release input matches the pinned digest."
      - name: Verify the pinned camera build in an iPhone simulator
        env:
          EXPECTED_CARD_TREE: 'fe7666c2c98ead79278af2be6eeff5c6289ad4c6'
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/ios-internal-sign"
          src="$private_dir/source"
          qa="$private_dir/CameraQA"
          {
            mv "$src/CardVault/Tests/BetaQA" "$private_dir/qa-input"
            git -C "$src" init -q
            git -C "$src" add -f -- CardVault
            test "$(git -C "$src" write-tree --prefix=CardVault/)" = "$EXPECTED_CARD_TREE"
            cp -R "$src/CardVault" "$qa"
            python3 "$private_dir/qa-input/fixture.py" "$qa" "$private_dir/qa-input/CredentialUITests.swift"
            cd "$src"
            xcrun swiftc CardVault/Sources/CardScanGuide.swift CardVault/Sources/CardTextRecognition.swift \
              CardVault/Sources/CredentialFields.swift CardVault/Sources/BankCardRecognition.swift \
              CardVault/Sources/CardImageCorrection.swift CardVault/Tests/ScanRecognitionChecks.swift \
              -o "$private_dir/scan-checks"
            "$private_dir/scan-checks"
            bash "$qa/scripts/build.sh" project
            device="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              for device in devices:
                  if device["isAvailable"] and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No installed iPhone simulator")
          ')"
            xcrun simctl boot "$device"
            xcrun simctl bootstatus "$device" -b
            xcrun simctl spawn "$device" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
            xcodebuild -quiet -project "$qa/CardVault.xcodeproj" -scheme CardVault -configuration Debug \
              -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
              -resultBundlePath "$private_dir/camera-regression.xcresult" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
            xcrun simctl shutdown "$device"
          } > "$private_dir/qa.log" 2>&1
          echo "CAMERA_GUIDE_REGRESSION_PASSED"
      - name: Preserve encrypted camera diagnostics on failure
        if: failure()
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/ios-internal-sign"
          if test -s "$d/qa.log" && test -x "$d/venv/bin/python"; then
            "$d/venv/bin/python" .github/ios-sign-once/transport.py seal \
              .github/ios-sign-once/diagnostic-public.pem "$d/qa.log" "$d/camera-diagnostics.sealed"
            shasum -a 256 "$d/qa.log" | cut -d ' ' -f 1 > "$d/camera-diagnostics.sha256"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: camera-operator-diagnostics
          path: |
            ${{ runner.temp }}/ios-internal-sign/camera-diagnostics.sealed
            ${{ runner.temp }}/ios-internal-sign/camera-diagnostics.sha256
          if-no-files-found: ignore
          retention-days: 1
      - name: Remove temporary camera data
        if: always()
        run: rm -rf "$RUNNER_TEMP/ios-internal-sign"
