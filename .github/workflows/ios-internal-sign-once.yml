name: Verify credential icons and ship the internal beta
on:
  push:
    branches: ['codex/ios-sign-once-icons-60da9d21']
    paths: ['.github/workflows/ios-internal-sign-once.yml']
permissions:
  contents: read
concurrency:
  group: cards-icons-internal-beta
  cancel-in-progress: false
jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 42
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare a run-specific encrypted intake
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/ios-internal-sign"
          mkdir -m 700 "$private_dir"
          python3 -m venv "$private_dir/venv"
          "$private_dir/venv/bin/pip" install --quiet 'cryptography==50.0.0'
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$private_dir/private.pem" 2>/dev/null
          openssl pkey -in "$private_dir/private.pem" -pubout > "$private_dir/Public.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-one-shot-public-key
          path: ${{ runner.temp }}/ios-internal-sign/Public.pem
          retention-days: 1
          if-no-files-found: error
      - name: Fetch and validate the sealed release input
        env:
          EXPECTED_ARCHIVE_SHA: '2c08715333725025f334b11545c86534613f17d7a3d398676290e799f8c02725'
          EXPECTED_SOURCE: '60da9d217a66c30cb1cfc59a29bfaae9ead1fe31'
          SEALED_INPUT_BRANCH: 'codex/cards-icons-sealed-60da9d21'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/ios-internal-sign"
          py="$private_dir/venv/bin/python"
          # Accept only the sealed source digest pinned to this validation and beta run.
          ref="repos/$GITHUB_REPOSITORY/git/ref/heads/$SEALED_INPUT_BRANCH"
          input_commit=""
          for check in $(seq 1 120); do
            if input_commit="$(gh api "$ref" --jq '.object.sha' 2>/dev/null)"; then break; fi
            sleep 5
          done
          if ! [[ "$input_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The authorized sealed input did not arrive.'; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$input_commit?recursive=1" \
            --jq '.tree[] | select(.type == "blob" and (.path | test("^\\.github/cards-icons-intake/part-[0-9]{3}$"))) | [.path, .sha] | @tsv' \
            | LC_ALL=C sort > "$private_dir/parts.tsv"
          test -s "$private_dir/parts.tsv"
          : > "$private_dir/Package.sealed"
          while IFS=$'\t' read -r path blob; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' \
              | python3 -c 'import base64, sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' >> "$private_dir/Package.sealed"
          done < "$private_dir/parts.tsv"
          "$py" .github/ios-sign-once/transport.py open "$private_dir/private.pem" "$private_dir/Package.sealed" "$EXPECTED_ARCHIVE_SHA" "$private_dir/source.tgz"
          rm -f "$private_dir/private.pem" "$private_dir/Package.sealed"
          mkdir -m 700 "$private_dir/source"
          "$py" .github/ios-sign-once/transport.py extract "$private_dir/source.tgz" "$private_dir/source"
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["verified_source"] == sys.argv[2]' "$private_dir/source/release.json" "$EXPECTED_SOURCE"
          rm -f "$private_dir/source.tgz"
          echo "Release input matches the pinned digest."
      - name: Compile the pinned application for iOS Simulator
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/ios-internal-sign"
          cd "$private_dir/source"
          if ! bash CardVault/scripts/build.sh simulator > "$private_dir/project.log" 2>&1; then
            echo "::error::The pinned application failed the simulator compile."
            exit 1
          fi
          echo "The pinned iOS application compiled."
      - name: Run the existing iPhone simulator checks
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/ios-internal-sign"
          cd "$private_dir/source"
          if ! bash CardVault/scripts/smoke.sh > "$private_dir/smoke.log" 2>&1; then
            echo "::error::The pinned application failed the existing smoke checks."
            exit 1
          fi
          echo "The existing iPhone simulator checks passed."
      - name: Preserve encrypted simulator diagnostics on failure
        if: failure()
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/ios-internal-sign"
          if test -f "$private_dir/smoke.log"; then
            log="$private_dir/smoke.log"
          elif test -f "$private_dir/project.log"; then
            log="$private_dir/project.log"
          else
            exit 0
          fi
          tail -n 120 "$log" > "$private_dir/simulator-diagnostics.txt"
          shasum -a 256 "$private_dir/simulator-diagnostics.txt" | cut -d ' ' -f1 > "$private_dir/simulator-diagnostics.sha256"
          "$private_dir/venv/bin/python" .github/ios-sign-once/transport.py seal .github/ios-sign-once/diagnostic-public.pem "$private_dir/simulator-diagnostics.txt" "$private_dir/simulator-diagnostics.sealed"
          rm -f "$private_dir/simulator-diagnostics.txt"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cards-icons-simulator-diagnostics
          path: |
            ${{ runner.temp }}/ios-internal-sign/simulator-diagnostics.sealed
            ${{ runner.temp }}/ios-internal-sign/simulator-diagnostics.sha256
          if-no-files-found: ignore
          retention-days: 1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install release tooling
        run: gem install fastlane --version 2.231.0 --no-document
      - name: Verify Apple app and sign and upload the internal beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_SKIP_DOCS: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/ios-internal-sign"
          cd "$private_dir/source"
          read -r CARDS_ASC_APP_ID CARDS_IOS_TEAM_ID < <(python3 - <<'PY'
          import json, re
          from pathlib import Path
          value = json.loads(Path("release.json").read_text())
          assert re.fullmatch(r"[1-9][0-9]{4,19}", value["app_id"])
          assert re.fullmatch(r"[A-Z0-9]{10}", value["team_id"])
          print(value["app_id"], value["team_id"])
          PY
          )
          export CARDS_ASC_APP_ID CARDS_IOS_TEAM_ID
          export CARDS_ASC_KEY_ID="$ASC_KEY_ID" CARDS_ASC_ISSUER_ID="$ASC_ISSUER_ID" CARDS_ASC_API_KEY_P8="$ASC_API_KEY_P8"
          export CARDS_IOS_DISTRIBUTION_P12_BASE64="$IOS_DISTRIBUTION_P12_BASE64"
          export CARDS_IOS_DISTRIBUTION_P12_PASSWORD="$IOS_DISTRIBUTION_P12_PASSWORD"
          printf '%s\n' "$CARDS_ASC_API_KEY_P8" > "$private_dir/AuthKey.p8"
          ruby fetch_profile.rb "$private_dir/AuthKey.p8" "$private_dir/cards.mobileprovision"
          rm -f "$private_dir/AuthKey.p8"
          export CARDS_IOS_PROVISION_PROFILE_BASE64="$(base64 < "$private_dir/cards.mobileprovision" | tr -d '\n')"
          python3 CardVault/scripts/verify_signing.py
          echo "Exact Apple signing configuration verified."
          python3 "$GITHUB_WORKSPACE/.github/ios-sign-once/configure-lane.py"
          cd CardVault
          if ! python3 "$GITHUB_WORKSPACE/.github/ios-sign-once/limited-upload.py" "$private_dir/upload.log"; then
            python3 - "$private_dir/upload.log" <<'PY'
          import re, sys
          from pathlib import Path
          log = Path(sys.argv[1]).read_text(errors="replace")
          stages = re.findall(r"CARDS_SIGN_STAGE:([a-z-]+)", log)
          if stages:
              print("Last signing stage: " + stages[-1])
          if "NameError" in log:
              print("Fastlane reported a Ruby name resolution error.")
          if "NoMethodError" in log:
              print("Fastlane reported a Ruby method resolution error.")
          if "You must install Xcode" in log or "xcodebuild" in log and "** ARCHIVE FAILED **" in log:
              print("Xcode reported an archive failure.")
          if "No signing certificate" in log or "No profiles for" in log:
              print("Xcode could not find the requested signing assets.")
          codes = sorted(set(re.findall(r"ITMS-\d{5}", log)))
          if codes:
              print("Apple upload validation codes: " + ", ".join(codes))
          if "Successfully uploaded package to App Store Connect" in log:
              print("Apple received the upload, but processing has not yet been verified.")
          PY
            echo "::error::Signing, upload or Apple processing did not complete."
            exit 1
          fi
          echo "The pinned internal beta was uploaded to Apple."
      - name: Remove temporary signing data
        if: always()
        run: |
          set +e
          signing="$RUNNER_TEMP/hoooho-cards-signing"
          if test -f "$signing/profile.json"; then
            uuid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["uuid"])' "$signing/profile.json")"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          fi
          for chain in "$HOME/Library/Keychains/hoooho-cards-ci"{-db,.keychain-db,,.keychain}; do
            if test -f "$chain"; then security delete-keychain "$chain" 2>/dev/null || true; fi
          done
          rm -rf "$RUNNER_TEMP/ios-internal-sign" "$signing"

  verify:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install API token tooling
        run: gem install jwt --version 2.10.2 --no-document
      - name: Assign and verify the pinned internal build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          root=.github/cards-icons-beta
          ruby -c "$root/client.rb"
          ruby -c "$root/assign.rb"
          ruby "$root/assign.rb"
