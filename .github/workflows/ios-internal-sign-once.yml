name: Verify Visa originals in the current Cards beta
on:
  push:
    branches: ['codex/cards-visa-originals-qa-ef4e6585-r2']
    paths: ['.github/workflows/ios-internal-sign-once.yml']
permissions:
  contents: read
concurrency:
  group: cards-detail-internal-beta
  cancel-in-progress: true
jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare a run-specific encrypted intake
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/ios-internal-sign"
          mkdir -m 700 "$private_dir"
          python3 -m venv "$private_dir/venv"
          "$private_dir/venv/bin/pip" install --quiet 'cryptography==50.0.0'
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$private_dir/private.pem" 2>/dev/null
          openssl pkey -in "$private_dir/private.pem" -pubout > "$private_dir/Public.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-one-shot-public-key
          path: ${{ runner.temp }}/ios-internal-sign/Public.pem
          retention-days: 1
          if-no-files-found: error
      - name: Fetch and validate the sealed release input
        env:
          EXPECTED_ARCHIVE_SHA: '72d7f5cc868b1a6dfa03e3f1daad5b658848c7adbf94fb5346e46d8f5d0801e3'
          EXPECTED_SOURCE: 'ef4e658526b56ef77bab7ccc86bc192662c124dc'
          SEALED_INPUT_BRANCH: 'codex/cards-visa-originals-qa-intake-ef4e6585-r2'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/ios-internal-sign"
          py="$private_dir/venv/bin/python"
          # Accept only the sealed source digest pinned to this validation and beta run.
          ref="repos/$GITHUB_REPOSITORY/git/ref/heads/$SEALED_INPUT_BRANCH"
          input_commit=""
          for check in $(seq 1 120); do
            if input_commit="$(gh api "$ref" --jq '.object.sha' 2>/dev/null)"; then break; fi
            sleep 5
          done
          if ! [[ "$input_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The authorized sealed input did not arrive.'; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$input_commit?recursive=1" \
            --jq '.tree[] | select(.type == "blob" and (.path | test("^\\.github/cards-detail-intake/part-[0-9]{3}$"))) | [.path, .sha] | @tsv' \
            | LC_ALL=C sort > "$private_dir/parts.tsv"
          test -s "$private_dir/parts.tsv"
          : > "$private_dir/Package.sealed"
          while IFS=$'\t' read -r path blob; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' \
              | python3 -c 'import base64, sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' >> "$private_dir/Package.sealed"
          done < "$private_dir/parts.tsv"
          "$py" .github/ios-sign-once/transport.py open "$private_dir/private.pem" "$private_dir/Package.sealed" "$EXPECTED_ARCHIVE_SHA" "$private_dir/source.tgz"
          rm -f "$private_dir/private.pem" "$private_dir/Package.sealed"
          mkdir -m 700 "$private_dir/source"
          "$py" .github/ios-sign-once/transport.py extract "$private_dir/source.tgz" "$private_dir/source"
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["verified_source"] == sys.argv[2]' "$private_dir/source/release.json" "$EXPECTED_SOURCE"
          rm -f "$private_dir/source.tgz"
          echo "Release input matches the pinned digest."
      - name: Prepare the synthetic device fixture
        run: |
          cp -R "$RUNNER_TEMP/ios-internal-sign/source/CardVault" "$RUNNER_TEMP/DetailQA"
          python3 .github/cards-detail-qa/fixture.py "$RUNNER_TEMP/DetailQA" .github/cards-detail-qa/CredentialUITests.swift
          bash "$RUNNER_TEMP/DetailQA/scripts/build.sh" project
      - name: Exercise saved originals, verification and legacy records
        timeout-minutes: 12
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              for device in devices:
                  if device["isAvailable"] and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No installed iPhone simulator")
          ')"
          echo "Running the Visa detail test on the selected iPhone simulator."
          xcodebuild -project "$RUNNER_TEMP/DetailQA/CardVault.xcodeproj" -scheme CardVault -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -only-testing:CredentialUITests/CredentialUITests/testBankScanShowsFullNumbersBeforeSaveAndMasksUntilVerified \
            -resultBundlePath "$RUNNER_TEMP/credential-detail.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test 2>&1 \
            | tee "$RUNNER_TEMP/credential-detail-test.log" \
            | awk '/VISA QA|Test Case|Test Suite|error:|warning:|\*\* TEST|CoreSimulator|Execute|Testing started/ {print; fflush()}'
      - name: Export screenshots from the synthetic flow
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/credential-detail.xcresult"; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/credential-detail.xcresult" \
              --output-path "$RUNNER_TEMP/credential-detail-screenshots"
            find "$RUNNER_TEMP/credential-detail-screenshots" -type f ! -name '*.png' -delete
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-detail-screenshots
          path: ${{ runner.temp }}/credential-detail-screenshots
          retention-days: 7

      - name: Clear temporary fixture data
        if: always()
        run: rm -rf "$RUNNER_TEMP/ios-internal-sign" "$RUNNER_TEMP/DetailQA"
