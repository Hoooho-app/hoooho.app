name: Read current Cards beta processing status
on:
  push:
    branches: ['codex/cards-status-bank-28004433']
    paths:
      - '.github/cards-asc-rename/status.rb'
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install API token tooling
        run: gem install jwt --version 2.10.2 --no-document
      - name: Read the pinned app build versions
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          root=.github/cards-asc-rename
          ruby -c "$root/client.rb"
          ruby "$root/status.rb"
