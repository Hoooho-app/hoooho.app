name: Quick search verification
on:
  pull_request:
    paths: ['src/pages/NurseStation/recordFinderModel*', 'src/pages/NurseStation/RecordFinder.tsx', 'src/pages/NurseStation/QuickSearchPage.css', 'src/pages/HealthEvents/JournalSearchResults.tsx', 'src/pages/HealthEvents/JournalSearchPage.tsx', 'src/pages/HealthEvents/useJournal.ts', 'src/services/apiClient*', 'src/services/abortable*', 'src/services/sharedRequests*', 'src/services/journalIndexRequests.ts', 'src/features/ai-business/recordingAudio*', 'src/features/ai-business/useSmartRecordVoice.ts', 'server/ai/audio-transcription*', 'server/ai/compressed-audio*', 'server/ai/vite-ai-plugin*', 'tests/home-flows/quick-search*', 'tests/home-flows/unified-search-release.mjs', '.github/workflows/quick-search-verification.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bound system dependency download waits
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hoooho-ci-timeouts >/dev/null <<'APT'
          Acquire::Retries "1";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT
      - name: Use bundled media tools
        run: |
          node --input-type=module <<'NODE'
          import ffmpeg from '@ffmpeg-installer/ffmpeg'
          import ffprobe from 'ffprobe-static'
          import { dirname } from 'node:path'
          import { appendFileSync } from 'node:fs'
          appendFileSync(process.env.GITHUB_PATH, [dirname(ffmpeg.path), dirname(ffprobe.path), ''].join('\n'))
          NODE
      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - run: npx playwright install chromium
      - name: Verify browser system dependencies
        run: |
          hoho_browser_smoke='const { chromium } = require("@playwright/test"); chromium.launch().then(browser => browser.close()).catch(error => { console.error(error); process.exitCode = 1; });'
          if ! node -e "$hoho_browser_smoke"; then
            npx playwright install-deps chromium
            node -e "$hoho_browser_smoke"
          fi
      - run: node --test server/ai/audio-transcription-service.test.mjs
      - run: npm run test:client
      - run: npm run build
      - run: npx playwright test --config tests/home-flows/playwright.config.ts quick-search.spec.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-search-browser-evidence
          path: test-results/
  live:
    if: github.head_ref == 'codex/quick-search-fuzzy-20261017'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify Production (single environment)
        run: node tests/home-flows/quick-search-release.mjs https://hoooho.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-search-online-evidence
          path: outputs/quick-search/
