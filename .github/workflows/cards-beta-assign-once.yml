name: Verify and assign an internal iOS beta
on:
  push:
    branches: ['codex/cards-beta-assign-a6108acf']
    paths: ['.github/cards-beta-assign/ready']
permissions:
  contents: read
jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install the JWT client
        run: gem install jwt --version 2.10.2 --no-document
      - name: Verify the exact internal build and confirm Testing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: ruby .github/cards-beta-assign/assign.rb
