# Task-only verification branch. Do not merge this workflow into main.
# Checks the immutable release candidate with the existing synthetic suites.
name: Focused home release verification
on:
  push:
    branches: ['codex/home-help-release-check-20261030']
permissions:
  contents: read
concurrency:
  group: home-help-release-check
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/codex/home-help-release-check-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25baccbb3ab9f49fd52ada71ce760bc5d8b5d38b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Use existing bundled media tools
        run: |
          node --input-type=module <<'NODE'
          import ffmpeg from '@ffmpeg-installer/ffmpeg'
          import ffprobe from 'ffprobe-static'
          import { dirname } from 'node:path'
          import { appendFileSync } from 'node:fs'
          appendFileSync(process.env.GITHUB_PATH, [dirname(ffmpeg.path), dirname(ffprobe.path), ''].join('\n'))
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Verify exact candidate and build
        run: |
          test "$(git rev-parse HEAD)" = 25baccbb3ab9f49fd52ada71ce760bc5d8b5d38b
          npm run build
      - name: Recheck all first-child cases with the static portrait contract
        run: npx playwright test --config tests/conversation-home/first-child.config.ts --reporter=line
      - name: Check the previously unexecuted shared-page visual cases
        run: npx playwright test --config tests/conversation-home/forest.config.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-help-release-check-evidence
          retention-days: 7
          path: |
            test-results/first-child-setup/
            test-results/forest/
