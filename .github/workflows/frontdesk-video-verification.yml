name: Frontdesk video verification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/HealthEvents/NurseStationIdleVideo.tsx'
      - 'src/pages/NurseStation/FrontDeskWelcome.tsx'
      - 'src/pages/NurseStation/conversationHome.css'
      - 'src/assets/nurse-triage/nurse-station-cutout-*'
      - 'scripts/*nurse*'
      - 'tests/nurse-video-cutout/**'
      - '.github/workflows/frontdesk-video-verification.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: TZ=Asia/Shanghai npm run test:client
      - run: npm run test:media
      - run: npx playwright test --config tests/nurse-video-cutout/playwright.config.ts
      - run: npx playwright test --config tests/frontdesk-navigation/playwright.config.ts --grep 'default home|keyboard reveals'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontdesk-video-evidence
          retention-days: 7
          path: test-results/
