name: Frontdesk welcome verification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/HealthEvents/NurseStationIdleVideo.tsx'
      - 'src/pages/NurseStation/FrontDeskWelcome.tsx'
      - 'src/pages/NurseStation/FrontDeskCareCard.tsx'
      - 'src/features/care-journey/**'
      - 'server/care-journey/**'
      - 'src/pages/NurseStation/FrontDeskBanner.tsx'
      - 'src/pages/NurseStation/conversationHome.css'
      - 'src/pages/NurseStation/frontDeskWelcome.css'
      - 'src/pages/Help/**'
      - 'src/features/allergy-knowledge/**'
      - 'src/features/ai-business/SmartRecordWorkspace.tsx'
      - 'shared/product-visibility.mjs'
      - 'src/assets/nurse-triage/care-recording-*'
      - 'src/assets/nurse-triage/front-desk-nurse-*'
      - 'src/assets/nurse-triage/record-archive-*'
      - 'src/assets/nurse-triage/visit-summary-banner-*'
      - 'src/assets/nurse-triage/nurse-station-cutout-*'
      - 'scripts/*nurse*'
      - 'tests/frontdesk-welcome/**'
      - 'tests/help-center/**'
      - '.github/workflows/frontdesk-video-verification.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Use bundled media tools for voice acceptance
        run: |
          node --input-type=module <<'NODE'
          import ffmpeg from '@ffmpeg-installer/ffmpeg'
          import ffprobe from 'ffprobe-static'
          import { dirname } from 'node:path'
          import { appendFileSync } from 'node:fs'
          appendFileSync(process.env.GITHUB_PATH, [dirname(ffmpeg.path), dirname(ffprobe.path), ''].join('\n'))
          NODE
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: TZ=Asia/Shanghai npm run test:client
      - run: node --test server/care-journey/service.test.mjs server/care-journey/api.test.mjs
      - run: npm run test:media
      - run: npx playwright test --config tests/frontdesk-welcome/playwright.config.ts --reporter=line --max-failures=1
      - run: npx playwright test --config tests/frontdesk-navigation/playwright.config.ts --grep 'default home|keyboard reveals|drawer uses'
      - run: npx playwright test --config tests/help-center/playwright.config.ts --reporter=line --max-failures=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontdesk-video-evidence
          retention-days: 7
          path: test-results/
