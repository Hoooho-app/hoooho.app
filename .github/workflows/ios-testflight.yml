name: Read-only TestFlight readiness
run-name: Read-only TestFlight readiness (no upload)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    if: github.ref == 'refs/heads/codex/testflight-readiness-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify safe receipt with synthetic credentials
        run: node --test scripts/ios/testflight-readiness.test.mjs
      - name: Read exact build and existing internal group status without writes
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: node scripts/ios/testflight-readiness.mjs
