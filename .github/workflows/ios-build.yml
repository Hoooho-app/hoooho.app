name: iOS beta build
on:
  pull_request:
    paths: ['ios/**', 'scripts/ios/**', '.github/workflows/ios-*.yml']
  push:
    branches: [main]
    paths: ['ios/**', 'scripts/ios/**', '.github/workflows/ios-*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Xcode project and existing brand icon
        run: bash scripts/ios/prepare.sh
      - name: Validate property lists
        run: |
          plutil -lint ios/Hoooho/App/Info.plist ios/Hoooho/App/PrivacyInfo.xcprivacy
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          devices=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","--json"]))["devices"]
          phones=[d for runtime,items in devices.items() if "iOS" in runtime for d in items if d.get("isAvailable") and d["name"].startswith("iPhone")]
          if not phones: raise SystemExit("No iPhone simulator available")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f: f.write("id="+phones[0]["udid"]+"\n")
          PY
      - name: Build and run native tests without signing or production writes
        run: |
          xcodebuild test -project ios/Hoooho/HooohoRecords.xcodeproj -scheme HooohoRecords -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -derivedDataPath ios/Hoooho/build/DerivedData -resultBundlePath ios/Hoooho/build/NativeTests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Build device archive without signing
        run: |
          xcodebuild archive -project ios/Hoooho/HooohoRecords.xcodeproj -scheme HooohoRecords -destination 'generic/platform=iOS' -archivePath ios/Hoooho/build/HooohoRecords-UNSIGNED.xcarchive CODE_SIGNING_ALLOWED=NO
      - name: Publish unsigned artifacts and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoooho-ios-unsigned-and-test-evidence
          path: |
            ios/Hoooho/build/NativeTests.xcresult
            ios/Hoooho/build/DerivedData/Build/Products/Debug-iphonesimulator/HooohoRecords.app
            ios/Hoooho/build/HooohoRecords-UNSIGNED.xcarchive
            ios/Hoooho/HooohoRecords.xcodeproj
          retention-days: 7
