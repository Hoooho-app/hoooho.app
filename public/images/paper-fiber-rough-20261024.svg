<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="fibers" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".12 .36" numOctaves="3" seed="17" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .34  0 0 0 0 .29  0 0 0 0 .22  .65 0 0 0 -.27"/>
    </filter>
    <filter id="tooth" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".74" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .42  0 0 0 0 .37  0 0 0 0 .29  .48 0 0 0 -.22"/>
    </filter>
  </defs>
  <rect width="256" height="256" filter="url(#fibers)" opacity=".28"/>
  <rect width="256" height="256" filter="url(#tooth)" opacity=".45"/>
</svg>
