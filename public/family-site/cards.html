<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafb">
  <title>护护证件卡包 · 家庭证件整理｜Hoooho</title>
  <meta name="description" content="用护护证件卡包按家人整理证件、检查有效期，在办事前找到需要的资料。了解卡包的使用方式、技术支持和隐私政策。">
  <link rel="canonical" href="https://hoooho.com/id-cards">
  <link rel="icon" type="image/webp" href="/family-site/card-assets/wallet-icon.webp">
  <link rel="stylesheet" href="/family-site/cards-brand.css">
  <link rel="stylesheet" href="/family-site/cards.css">
</head>
<body>
  <a class="wallet-skip" href="#main-content">跳至主要内容</a>
  <header class="wallet-header">
    <div class="wallet-wrap">
      <a class="wallet-brand" href="/id-cards" aria-current="page"><img src="/family-site/card-assets/wallet-icon.webp" alt="" width="36" height="36">护护证件卡包</a>
      <nav class="wallet-nav" aria-label="网站导航"><a href="/">护护首页</a><a href="/id-cards/support">技术支持</a><a href="/id-cards/privacy">隐私政策</a></nav>
    </div>
  </header>
  <main id="main-content" class="product-page">
    <div class="wallet-wrap showcase">
      <div class="product-intro">
        <h1>全家人的<br><span>证件卡包。</span></h1>
        <p>拍下证件，按家人收好。出发前查有效期，办事时分享需要的副本。</p>
      </div>
      <fieldset class="product-demo">
        <legend>选择要预览的卡包功能</legend>
        <input class="demo-choice" type="radio" name="demo" id="demo-family" checked>
        <input class="demo-choice" type="radio" name="demo" id="demo-expiry">
        <input class="demo-choice" type="radio" name="demo" id="demo-export">
        <div class="feature-menu">
          <label for="demo-family" class="family-label">按人取用</label>
          <label for="demo-expiry" class="expiry-label">查看有效期</label>
          <label for="demo-export" class="export-label">导出副本</label>
        </div>
        <div class="feature-detail">
          <p class="family-panel">切换到家人名下，直接找到出行要用的护照或通行证。</p>
          <p class="expiry-panel">按家人、年份和月份查看到期日，提前安排换证。</p>
          <p class="export-panel">选好需要的页面、水印和遮挡范围，先预览，再分享。</p>
        </div>
        <div class="screen-stage">
          <figure class="display-screen family-panel">
            <div class="iphone-frame"><img src="/family-site/card-assets/feature-family.webp" width="320" height="695" alt="卡包证件页展示我、妈妈、女儿三个成员入口，出行分类中有护照和港澳通行证。" fetchpriority="high"></div>
            <figcaption>证件 · 家庭成员视图</figcaption>
          </figure>
          <figure class="display-screen expiry-panel">
            <div class="iphone-frame"><img src="/family-site/card-assets/feature-expiry.webp" width="777" height="1690" alt="有效期页面先选成员，再选择年和月，查看当月到期的资料列表。"></div>
            <figcaption>有效期 · 月度视图</figcaption>
          </figure>
          <figure class="display-screen export-panel">
            <div class="iphone-frame"><img src="/family-site/card-assets/feature-export.webp" width="680" height="1472" alt="卡包首次使用引导中的按需导出示例，展示带用途水印的副本。"></div>
            <figcaption>按需导出 · App 引导示例</figcaption>
          </figure>
          <img class="bear" src="/family-site/card-assets/organizer.webp" width="288" height="288" alt="">
        </div>
      </fieldset>
    </div>
  </main>
  <footer class="wallet-footer"><div class="wallet-wrap"><small>Hoooho 护护 · 护护证件卡包</small><nav class="wallet-nav" aria-label="页脚导航"><a href="/">护护首页</a><a href="/id-cards/support">技术支持</a><a href="/id-cards/privacy">隐私政策</a></nav></div></footer>
</body>
</html>
