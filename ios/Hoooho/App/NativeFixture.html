<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原生容器测试夹具</title><style>body{background:#f7f7f3;color:#224638;font:20px -apple-system,sans-serif;padding:36px}button{font:inherit;padding:16px}</style><h1>护护原生容器测试</h1><p>这是合成夹具，不是正式业务页面。</p><button id="sample">测试页面交互</button><p id="result"></p><button id="attachment">选择测试附件</button><p id="attachment-result"></p><script>document.getElementById("attachment").onclick=()=>window.webkit.messageHandlers.hooohoNative.postMessage({id:"native-attachment-fixture",type:"attachments"});window.__hooohoNativeReply=(id,result)=>{if(id==="native-attachment-fixture")document.getElementById("attachment-result").textContent=result.cancelled?"已取消附件选择":"附件选择已响应"};document.getElementById('sample').onclick=()=>document.getElementById('result').textContent='交互已响应';</script></html>
