<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>原生容器测试夹具</title><style>html{background:#f4f2ed}body{margin:0;min-height:100dvh;box-sizing:border-box;background:#f4f2ed;color:#224638;font:20px -apple-system,sans-serif;padding:36px}button{font:inherit;padding:16px}</style><h1>护护原生容器测试</h1><p>这是合成夹具，不是正式业务页面。</p><button id="sample">测试页面交互</button><p id="result"></p><button id="attachment">选择测试附件</button><button id="symptom-attachment">选择症状附件</button><p id="attachment-result"></p><script>document.getElementById("attachment").onclick=()=>{document.getElementById("attachment-result").textContent="正在选择附件";window.webkit.messageHandlers.hooohoNative.postMessage({id:"native-attachment-fixture",type:"attachments"})};document.getElementById("symptom-attachment").onclick=()=>{document.getElementById("attachment-result").textContent="正在选择附件";window.webkit.messageHandlers.hooohoNative.postMessage({id:"native-attachment-fixture",type:"attachments",mediaOnly:true})};window.__hooohoNativeReply=(id,result)=>{if(id==="native-attachment-fixture")document.getElementById("attachment-result").textContent=result.cancelled?"已取消附件选择":"附件选择已响应"};document.getElementById('sample').onclick=()=>document.getElementById('result').textContent='交互已响应';</script></html>
